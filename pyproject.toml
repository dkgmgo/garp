[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garp"
version = "0.1.0"
description = "Graph data preprocessing tool"
requires-python = ">=3.9"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
fast = ["pandas", "pyarrow"]
dev = ["pytest"]

[project.scripts]
tool = "garp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
